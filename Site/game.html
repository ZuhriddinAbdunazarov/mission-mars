<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play Mission Mars</title>
  <style>
    @font-face {
      font-family: "Baloo";
      src: url("../book/fonts/Baloo2.ttf");
      font-display: swap;
    }

    @font-face {
      font-family: "Nunito";
      src: url("../book/fonts/Nunito.ttf");
      font-display: swap;
    }

    :root {
      --navy: #0b1a2b;
      --mars: #e2622b;
      --gold: #f5b82e;
      --text: #f4f6f9;
      --dim: #c3ccd6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: "Nunito", Arial, sans-serif;
      overflow: hidden;
    }

    /* only the game: the canvas fills the whole window */
    #unity-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: block;
    }

    /* loading screen: real Mars photo, dark enough to read */
    #unity-loading-bar {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 16px;
      background: linear-gradient(rgba(7, 13, 24, .78), rgba(7, 13, 24, .86)), url("../book/img/PIA25681.jpg") center 70%/cover no-repeat, var(--navy);
    }

    .box {
      width: min(560px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .box h1 {
      margin: 0;
      font-family: "Baloo", sans-serif;
      font-size: clamp(44px, 8vw, 84px);
      line-height: 1;
      letter-spacing: .02em;
    }

    .box h1 span {
      color: #f39a54;
    }

    .box .hello {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 800;
    }

    .track {
      width: 100%;
      height: 18px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .15);
      overflow: hidden;
    }

    #unity-progress-bar-full {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mars), var(--gold));
      transition: width .3s;
    }

    #pct {
      font-size: 18px;
      color: var(--dim);
      font-weight: 700;
    }

    .keys {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }

    .key {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 16px;
    }

    .key b {
      color: var(--gold);
    }

    #unity-warning {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      z-index: 4;
      width: min(560px, 92vw);
    }

    #unity-warning div {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading-bar">
    <div class="box">
      <h1>MISSION <span>MARS</span></h1>
      <div class="hello">Get ready, Junior Astronaut! Your rocket is on its way to Mars…</div>
      <div class="track">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="pct">Loading 0%</div>
      <div class="keys">
        <div class="key"><b>W A S D</b> walk</div>
        <div class="key"><b>Mouse</b> look</div>
        <div class="key"><b>E</b> use</div>
        <div class="key"><b>Space</b> jump</div>
        <div class="key"><b>Esc</b> pause</div>
      </div>
    </div>
  </div>
  <div id="unity-warning"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var warn = document.querySelector("#unity-warning");
    function note(msg, color) {
      warn.innerHTML = "";
      var d = document.createElement("div");
      d.style.background = color || "#8a6d00";
      d.textContent = msg; warn.appendChild(d);
      return d;
    }
    // If a download gets cut off (weak Wi-Fi), try again by itself instead of showing a scary error.
    var failed = false;
    function retry(reason) {
      if (failed) return; failed = true;
      console.warn("[MissionMars] load failed:", reason);
      var n = 0; try { n = +sessionStorage.getItem("mm_retry") || 0; } catch (e) {}
      if (n < 3) {
        try { sessionStorage.setItem("mm_retry", n + 1); } catch (e) {}
        note("Connection hiccup… trying again (" + (n + 1) + "/3)");
        setTimeout(function () { location.reload(); }, 2000);
      } else {
        try { sessionStorage.removeItem("mm_retry"); } catch (e) {}
        var d = note("Your internet keeps dropping, so the game could not load. Check the Wi-Fi and try again.", "#b3261e");
        var b = document.createElement("button"); b.textContent = "Try again";
        b.style.cssText = "display:block;margin:10px auto 0;padding:8px 18px;border:0;border-radius:8px;font:inherit;font-weight:800;cursor:pointer";
        b.onclick = function () { location.reload(); }; d.appendChild(b);
      }
    }
    // Unity's own messages are for developers: keep them in the console; errors trigger a retry.
    function unityShowBanner(msg, type) {
      if (type === "error") retry(msg); else if (type === "warning") console.warn(msg);
    }
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      note("Mission Mars works best on a computer with a keyboard and mouse.");
      setTimeout(function () { warn.innerHTML = ""; }, 7000);
    }
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "SpaceAppsTeam",
      productName: "Mission Mars - The Launch Window",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };
    function show(p, text) {
      document.querySelector("#unity-progress-bar-full").style.width = (100 * p) + "%";
      document.querySelector("#pct").textContent = text || ("Loading " + Math.round(100 * p) + "%");
    }
    // ---- download the big files in 4 MB pieces (Build/parts.json), 3 at a time, retrying any piece that drops ----
    function getPiece(url, onBytes) {
      var tries = 0;
      function attempt() {
        tries++;
        var ctrl = window.AbortController ? new AbortController() : null, got = 0, timer;
        function stall() { clearTimeout(timer); timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 30000); } // no bytes for 30 s: try again
        stall();
        return fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function (b) { onBytes(b.byteLength); return b; });
          var reader = r.body.getReader(), chunks = [];
          function pump() {
            return reader.read().then(function (s) {
              if (s.done) return new Blob(chunks);
              chunks.push(s.value); got += s.value.byteLength; onBytes(s.value.byteLength); stall();
              return pump();
            });
          }
          return pump();
        }).then(function (b) { clearTimeout(timer); return b; }, function (e) {
          clearTimeout(timer); onBytes(-got); // forget the bytes of the dropped try
          if (tries >= 8) throw e;
          return new Promise(function (ok) { setTimeout(ok, 1000 * tries); }).then(attempt);
        });
      }
      return attempt();
    }
    function getPieces(list, onBytes) {
      var out = new Array(list.length), next = 0;
      function worker() {
        if (next >= list.length) return Promise.resolve();
        var i = next++;
        return getPiece(buildUrl + "/" + list[i], onBytes).then(function (b) { out[i] = b; return worker(); });
      }
      return Promise.all([worker(), worker(), worker()]).then(function () { return new Blob(out); });
    }
    function downloadPieces() {
      return fetch(buildUrl + "/parts.json", { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error("no parts.json");
        return r.json();
      }).then(function (m) {
        var total = m.data.size + m.code.size, done = 0;
        function onBytes(n) { done += n; show(0.85 * Math.min(1, done / total), "Loading " + Math.round(85 * done / total) + "%"); }
        return Promise.all([getPieces(m.data.parts, onBytes), getPieces(m.code.parts, onBytes)]).then(function (b) {
          config.dataUrl = URL.createObjectURL(b[0]);
          config.codeUrl = URL.createObjectURL(b[1]);
          config.cacheControl = function () { return "no-store"; }; // pieces are already in the browser's normal cache
          return 0.85;
        });
      }).catch(function (e) {
        console.warn("[MissionMars] pieces not used:", e); return 0; // fall back to the whole files
      });
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js";
    script.onload = function () {
      downloadPieces().then(function (base) {
        return createUnityInstance(canvas, config, function (p) { show(base + (1 - base) * p); });
      }).then(function () {
        try { sessionStorage.removeItem("mm_retry"); } catch (e) {}
        document.querySelector("#unity-loading-bar").style.display = "none";
        canvas.focus();
      }).catch(function (message) { retry(String(message)); });
    };
    script.onerror = function () { retry("loader.js failed to download"); };
    document.body.appendChild(script);
  </script>
</body>

</html>
